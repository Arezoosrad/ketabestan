<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>کیف پول من</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(165deg, #f7f2ff 0%, #f0e9fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Vazirmatn', sans-serif;
            position: relative;
        }

        /* decorative elements */
        body::before {
            content: "✦";
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 48px;
            color: rgba(190, 170, 230, 0.2);
            transform: rotate(15deg);
        }

        body::after {
            content: "✧";
            position: absolute;
            bottom: 20px;
            left: 40px;
            font-size: 56px;
            color: rgba(200, 175, 240, 0.15);
            transform: rotate(-10deg);
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        h2 {
            color: #7c6a9c;
            font-size: 26px;
            font-weight: 450;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 250, 255, 0.4);
            padding: 12px 20px;
            border-radius: 100px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(215, 190, 240, 0.3);
            box-shadow: 0 8px 20px rgba(170, 140, 200, 0.06);
        }

        .wallet-card {
            background: rgba(255, 250, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 42px 32px;
            box-shadow: 
                0 20px 40px -15px rgba(160, 130, 190, 0.2),
                0 0 0 1px rgba(255, 240, 255, 0.7),
                inset 0 0 20px rgba(245, 235, 255, 0.4);
            border: 1px solid rgba(230, 210, 250, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .wallet-card::before {
            content: "";
            position: absolute;
            top: -30%;
            right: -30%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(215, 190, 245, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .wallet-card::after {
            content: "";
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(200, 170, 235, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .wallet-card:hover {
            box-shadow: 
                0 28px 48px -18px rgba(170, 140, 210, 0.25),
                0 0 0 1px rgba(255, 245, 255, 0.8),
                inset 0 0 25px rgba(245, 230, 255, 0.5);
            transform: translateY(-5px);
            background: rgba(255, 252, 255, 0.8);
        }

        h3 {
            color: #7a67a0;
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 16px;
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h3::after {
            content: "☁️";
            font-size: 16px;
            opacity: 0.7;
        }

        h3::before {
            content: "☁️";
            font-size: 16px;
            opacity: 0.7;
        }

        .balance {
            background: rgba(245, 235, 255, 0.6);
            backdrop-filter: blur(8px);
            padding: 32px 24px;
            border-radius: 36px;
            font-size: 38px;
            font-weight: 500;
            color: #624c7c;
            text-align: center;
            margin: 16px 0 32px 0;
            box-shadow: 
                inset 0 6px 16px rgba(190, 165, 220, 0.08),
                inset 0 -2px 6px rgba(255, 245, 255, 0.7),
                0 8px 20px rgba(160, 130, 190, 0.06);
            border: 1px solid rgba(215, 190, 240, 0.3);
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            line-height: 1.2;
            word-break: break-word;
        }

        .balance::after {
            content: "تومان";
            font-size: 18px;
            font-weight: 350;
            color: #8a79b5;
            margin-right: 4px;
        }

        .balance::before {
            content: "⋆｡°✩";
            font-size: 18px;
            color: rgba(160, 130, 200, 0.4);
            letter-spacing: 6px;
            margin-left: 10px;
        }

        .menu {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 160px;
            background: rgba(235, 220, 250, 0.6);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(215, 190, 240, 0.4);
            border-radius: 100px;
            padding: 16px 24px;
            color: #6b5593;
            font-size: 17px;
            font-weight: 400;
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 8px 18px rgba(170, 140, 200, 0.08),
                0 0 0 1px rgba(255, 240, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: "✧";
            position: absolute;
            left: -5px;
            opacity: 0.3;
            color: #a58aca;
            font-size: 16px;
        }

        .btn::after {
            content: "✧";
            position: absolute;
            right: -5px;
            opacity: 0.3;
            color: #a58aca;
            font-size: 16px;
        }

        .btn:hover {
            background: rgba(230, 210, 250, 0.8);
            border-color: rgba(195, 165, 225, 0.7);
            color: #543d7a;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 16px 26px -8px rgba(170, 140, 210, 0.2),
                0 0 0 2px rgba(255, 245, 255, 0.7);
        }

        .btn:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 
                inset 0 6px 14px rgba(170, 140, 200, 0.12),
                0 0 0 2px rgba(255, 245, 255, 0.7);
        }

        /* responsive */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .container { max-width: 100%; }
            .wallet-card { padding: 32px 24px; border-radius: 40px; }
            h2 { font-size: 22px; padding: 10px 16px; }
            .balance { 
                font-size: 30px; 
                padding: 24px 16px;
                flex-wrap: wrap;
            }
            .balance::before {
                font-size: 16px;
                margin-left: 6px;
            }
            .btn {
                min-width: 100%;
                padding: 14px 20px;
                font-size: 16px;
            }
            .menu {
                flex-direction: column;
                gap: 12px;
            }
            body::before, body::after {
                opacity: 0.5;
            }
        }

        /* animation */
        @keyframes softGlow {
            0% { opacity: 0.7; }
            50% { opacity: 0.9; }
            100% { opacity: 0.7; }
        }

        .wallet-card {
            animation: softGlow 5s ease-in-out infinite;
        }

        ::selection {
            background: #e6d5ff;
            color: #4a3870;
        }

        /* custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(235, 220, 250, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(170, 140, 210, 0.3);
            border-radius: 100px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(170, 140, 210, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            <span style="opacity: 0.8;">💰</span>
            کیف پول کاربری
            <span style="opacity: 0.8;">✨</span>
        </h2>
        
        <div class="wallet-card">
            <h3>موجودی حساب</h3>
            <div class="balance">{{ balance|floatformat:0 }}</div>
            
            <div class="menu">
                <a href="{% url 'charge_wallet' %}" class="btn">
                    <span style="opacity: 0.9;">➕</span>
                    شارژ حساب
                </a>
                <a href="{% url 'cart_detail' %}" class="btn">
                    <span style="opacity: 0.9;">🛒</span>
                    رفتن به فروشگاه
                </a>
            </div>
        </div>
    </div>
</body>
</html>
