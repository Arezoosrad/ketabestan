<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شارژ کیف پول</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(165deg, #f7f2ff 0%, #f0e9fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Vazirmatn', sans-serif;
            position: relative;
        }

        /* decorative elements */
        body::before {
            content: "✧";
            position: absolute;
            top: 30px;
            right: 60px;
            font-size: 64px;
            color: rgba(190, 170, 230, 0.15);
            transform: rotate(20deg);
        }

        body::after {
            content: "✦";
            position: absolute;
            bottom: 30px;
            left: 60px;
            font-size: 72px;
            color: rgba(200, 175, 240, 0.12);
            transform: rotate(-15deg);
        }

        .charge-container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .charge-card {
            background: rgba(255, 250, 255, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 48px 40px;
            box-shadow: 
                0 25px 45px -18px rgba(160, 130, 200, 0.25),
                0 0 0 1px rgba(255, 240, 255, 0.7),
                inset 0 0 30px rgba(245, 235, 255, 0.4);
            border: 1.5px solid rgba(225, 205, 245, 0.4);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .charge-card:hover {
            box-shadow: 
                0 30px 55px -20px rgba(170, 140, 210, 0.3),
                0 0 0 1.5px rgba(255, 245, 255, 0.8),
                inset 0 0 35px rgba(245, 230, 255, 0.5);
            background: rgba(255, 252, 255, 0.8);
            transform: translateY(-6px);
        }

        /* gradient orbs */
        .charge-card::before {
            content: "";
            position: absolute;
            top: -20%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(220, 195, 250, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .charge-card::after {
            content: "";
            position: absolute;
            bottom: -20%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(205, 175, 240, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        h2 {
            color: #7c6a9c;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 32px;
            text-align: center;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            position: relative;
            z-index: 2;
            background: rgba(245, 235, 255, 0.4);
            padding: 14px 24px;
            border-radius: 100px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(215, 190, 240, 0.3);
            box-shadow: 0 8px 20px rgba(160, 130, 190, 0.06);
        }

        h2 span {
            background: rgba(235, 220, 250, 0.5);
            padding: 6px;
            border-radius: 50%;
            display: inline-flex;
        }

        .balance-pill {
            background: rgba(245, 235, 255, 0.6);
            backdrop-filter: blur(8px);
            padding: 18px 24px;
            border-radius: 100px;
            margin-bottom: 36px;
            text-align: center;
            border: 1.5px solid rgba(215, 190, 235, 0.35);
            box-shadow: 
                inset 0 4px 12px rgba(190, 165, 220, 0.06),
                0 10px 22px rgba(160, 130, 190, 0.08);
            position: relative;
            z-index: 2;
        }

        .balance-pill p {
            color: #6d5a8b;
            font-size: 17px;
            font-weight: 350;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .balance-pill strong {
            color: #624c7c;
            font-size: 24px;
            font-weight: 550;
            margin-right: 8px;
            background: linear-gradient(145deg, #6a5590, #5b4680);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(170, 140, 210, 0.2);
        }

        .section-title {
            color: #7a67a0;
            font-size: 18px;
            font-weight: 450;
            margin-bottom: 22px;
            text-align: right;
            padding-right: 12px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: "⋆｡°✩";
            letter-spacing: 6px;
            color: rgba(180, 150, 220, 0.5);
            font-size: 15px;
        }

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .amount-option {
            background: rgba(240, 230, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1.8px solid rgba(215, 190, 240, 0.35);
            border-radius: 50px;
            padding: 15px 18px;
            color: #6b5593;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 6px 14px rgba(170, 140, 200, 0.04),
                0 0 0 1px rgba(255, 240, 255, 0.4);
        }

        .amount-option::before {
            content: "✧";
            position: absolute;
            left: -5px;
            opacity: 0.2;
            color: #a58aca;
            font-size: 18px;
        }

        .amount-option::after {
            content: "✧";
            position: absolute;
            right: -5px;
            opacity: 0.2;
            color: #a58aca;
            font-size: 18px;
        }

        .amount-option:hover {
            background: rgba(235, 220, 250, 0.8);
            border-color: rgba(200, 170, 230, 0.6);
            color: #543d7a;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 16px 24px -10px rgba(170, 140, 210, 0.18),
                0 0 0 2px rgba(255, 245, 255, 0.6);
        }

        .amount-option.selected {
            background: rgba(230, 210, 250, 0.9);
            border-color: rgba(195, 165, 225, 0.9);
            color: #4f3875;
            font-weight: 500;
            box-shadow: 
                inset 0 4px 12px rgba(180, 150, 220, 0.15),
                0 10px 20px -8px rgba(170, 140, 210, 0.2);
            border-width: 2px;
        }

        .custom-amount {
            margin: 32px 0 28px;
            position: relative;
            z-index: 2;
        }

        .custom-amount label {
            display: block;
            color: #7a67a0;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 12px;
            text-align: right;
            padding-right: 10px;
        }

        .dream-input {
            width: 100%;
            padding: 18px 26px;
            background: rgba(250, 245, 255, 0.7);
            border: 2px solid rgba(215, 190, 240, 0.4);
            border-radius: 100px;
            font-size: 17px;
            color: #5b4785;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.25s ease;
            box-shadow: 
                inset 0 6px 16px rgba(200, 175, 225, 0.06),
                0 0 0 1px rgba(255, 240, 255, 0.5);
            backdrop-filter: blur(4px);
        }

        .dream-input:focus {
            outline: none;
            background: rgba(255, 250, 255, 0.9);
            border-color: rgba(195, 165, 225, 0.9);
            box-shadow: 
                inset 0 6px 20px rgba(190, 160, 220, 0.1),
                0 0 0 4px rgba(225, 200, 250, 0.2);
        }

        .dream-input::placeholder {
            color: #b29fc9;
            font-weight: 300;
            font-size: 15px;
        }

        .magic-button {
            width: 100%;
            background: rgba(215, 190, 240, 0.6);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(225, 205, 245, 0.5);
            border-radius: 200px;
            padding: 20px 28px;
            color: #54407c;
            font-size: 21px;
            font-weight: 450;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 20px 30px -14px rgba(160, 130, 200, 0.25),
                0 0 0 1.5px rgba(255, 240, 255, 0.6);
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            position: relative;
            z-index: 2;
            letter-spacing: 1px;
        }

        .magic-button:hover {
            background: rgba(225, 205, 245, 0.8);
            border-color: rgba(210, 180, 235, 0.8);
            color: #48346e;
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 30px 40px -16px rgba(160, 130, 200, 0.35),
                0 0 0 2.5px rgba(255, 245, 255, 0.8);
        }

        .magic-button:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 
                inset 0 8px 20px rgba(160, 130, 200, 0.2),
                0 0 0 2.5px rgba(255, 245, 255, 0.8);
        }

        .return-portal {
            margin-top: 36px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .return-portal a {
            color: #8a79b5;
            font-size: 16px;
            font-weight: 400;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 16px 30px;
            border-radius: 120px;
            background: rgba(245, 235, 255, 0.5);
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            border: 1.8px solid rgba(215, 190, 235, 0.4);
            box-shadow: 0 8px 18px rgba(160, 130, 190, 0.08);
        }

        .return-portal a:hover {
            background: rgba(240, 225, 255, 0.8);
            border-color: rgba(200, 170, 230, 0.7);
            color: #634d91;
            transform: translateX(-8px) scale(1.03);
            box-shadow: 0 14px 26px rgba(160, 130, 190, 0.16);
        }

        /* Responsive */
        @media (max-width: 520px) {
            body { padding: 16px; }
            .charge-card { padding: 36px 28px; border-radius: 48px; }
            h2 { font-size: 24px; padding: 12px 20px; }
            .balance-pill strong { font-size: 20px; }
            .amount-grid { grid-template-columns: 1fr; }
            .magic-button { font-size: 19px; padding: 18px 24px; }
            .dream-input { padding: 16px 22px; }
            body::before, body::after { 
                font-size: 48px; 
                opacity: 0.3;
            }
        }

        @media (max-width: 380px) {
            .charge-card { padding: 28px 20px; }
            h2 { font-size: 22px; }
            .amount-option { padding: 13px 16px; }
        }

        /* animation */
        @keyframes floatDream {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        .charge-card {
            animation: floatDream 7s ease-in-out infinite;
        }

        /* remove spinner */
        input[type=number]::-webkit-inner-spin-button { 
            opacity: 0.2;
            margin-right: 5px;
        }

        ::selection {
            background: #e6d5ff;
            color: #4a3870;
        }
    </style>
</head>
<body>
    <div class="charge-container">
        <div class="charge-card">
            <h2>
                <span>➕</span>
                شارژ کیف پول
                <span>✨</span>
            </h2>
            
            {% if request.user.wallet %}
            <div class="balance-pill">
                <p>
                    <span style="opacity: 0.7;">☁️</span>
                    موجودی فعلی 
                    <strong>{{ request.user.wallet.balance|floatformat:0 }} تومان</strong>
                    <span style="opacity: 0.7;">☁️</span>
                </p>
            </div>
            {% endif %}
            
            <form method="POST" action="{% url 'charge_wallet' %}">
                {% csrf_token %}
                
                <div class="section-title">
                    <span>✦</span>
                    مبلغ شارژ
                </div>
                
                <div class="amount-grid">
                    <button type="button" class="amount-option" data-amount="10000">۱۰,۰۰۰</button>
                    <button type="button" class="amount-option" data-amount="50000">۵۰,۰۰۰</button>
                    <button type="button" class="amount-option" data-amount="100000">۱۰۰,۰۰۰</button>
                    <button type="button" class="amount-option" data-amount="200000">۲۰۰,۰۰۰</button>
                    <button type="button" class="amount-option" data-amount="500000">۵۰۰,۰۰۰</button>
                    <button type="button" class="amount-option" data-amount="1000000">۱,۰۰۰,۰۰۰</button>
                </div>
                
                <div class="custom-amount">
                    <label>
                        <span style="opacity: 0.7;">⋆｡°✩</span>
                        مبلغ دلخواه (تومان)
                    </label>
                    <input type="number" name="amount" id="id_amount" class="dream-input" placeholder="مثلاً ۷۵۰,۰۰۰ تومان" min="1000" step="1000">
                </div>
                
                <button type="submit" class="magic-button">
                    <span style="opacity: 0.9;">✨</span>
                    شارژ کیف پول
                    <span style="opacity: 0.9;">✨</span>
                </button>
            </form>
            
            <div class="return-portal">
                <a href="{% url 'wallet_detail' %}">
                    <span style="opacity: 0.7;">🪽</span>
                    بازگشت به کیف پول
                    <span style="transform: scaleX(-1); display: inline-block; opacity: 0.7;">🪽</span>
                </a>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            const amountButtons = document.querySelectorAll('.amount-option');
            const amountInput = document.getElementById('id_amount');
            
            // clean selected state
            function removeSelected() {
                amountButtons.forEach(btn => btn.classList.remove('selected'));
            }
            
            // add click handlers
            amountButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    removeSelected();
                    this.classList.add('selected');
                    amountInput.value = this.dataset.amount;
                    
                    // subtle feedback
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => { this.style.transform = ''; }, 150);
                });
            });

            // handle manual input
            if (amountInput) {
                amountInput.addEventListener('input', function() {
                    if (this.value < 0) this.value = 1000;
                    removeSelected();
                });
                
                // placeholder magic
                amountInput.addEventListener('focus', function() {
                    this.placeholder = 'هر مبلغی که دوست داری...';
                });
                
                amountInput.addEventListener('blur', function() {
                    this.placeholder = 'مثلاً ۷۵۰,۰۰۰ تومان';
                });
            }
        })();
    </script>
</body>
</html>
